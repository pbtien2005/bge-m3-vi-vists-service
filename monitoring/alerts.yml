groups:
  - name: embedding-service
    rules:
      - alert: EmbeddingGatewayHighP95Latency
        expr: histogram_quantile(0.95, sum(rate(embedding_gateway_request_duration_seconds_bucket{route="/v1/embeddings"}[5m])) by (le)) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Embedding gateway p95 latency is above 100ms"

      - alert: EmbeddingGatewayHighP99Latency
        expr: histogram_quantile(0.99, sum(rate(embedding_gateway_request_duration_seconds_bucket{route="/v1/embeddings"}[5m])) by (le)) > 0.20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Embedding gateway p99 latency is above 200ms"

      - alert: EmbeddingGateway5xxSpike
        expr: sum(rate(embedding_gateway_requests_total{status_code=~"5.."}[5m])) > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Embedding gateway is returning elevated 5xx responses"

      - alert: EmbeddingGatewayRateLimitSpike
        expr: rate(embedding_gateway_rate_limit_rejections_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Embedding gateway rate limiting increased"

      - alert: EmbeddingUpstreamDown
        expr: embedding_gateway_upstream_healthy == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Gateway sees an embedding worker as unhealthy"

      - alert: EmbeddingUpstreamTimeouts
        expr: sum(rate(embedding_gateway_upstream_errors_total{code="timeout"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Embedding worker timeout errors detected"
