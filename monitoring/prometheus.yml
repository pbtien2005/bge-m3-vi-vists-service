global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: embedding-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8000

  - job_name: tei-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - tei-gpu0:9000
          - tei-gpu1:9000
