services:
  tei-gpu0:
    image: ghcr.io/huggingface/text-embeddings-inference:1.9
    restart: unless-stopped
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      AUTO_TRUNCATE: "false"
      TOKENIZATION_WORKERS: "${TEI_TOKENIZATION_WORKERS:-8}"
      # Required only if HF_MODEL_ID points to a private Hugging Face repo.
      HF_TOKEN: "${HF_TOKEN:-}"
    expose:
      - "80"
      - "9000"
    # For local debugging only, uncomment:
    # ports:
    #   - "127.0.0.1:8081:80"
    command:
      - "--model-id"
      - "${HF_MODEL_ID:-phambatien/bge-m3-vi-vists-best-eval}"
      - "--served-model-name"
      - "${MODEL_NAME:-bge-m3-vi-vists}"
      - "--dtype"
      - "float16"
      - "--pooling"
      - "cls"
      - "--max-concurrent-requests"
      - "${TEI_MAX_CONCURRENT_REQUESTS:-128}"
      - "--max-batch-tokens"
      - "${TEI_MAX_BATCH_TOKENS:-8192}"
      - "--max-batch-requests"
      - "${TEI_MAX_BATCH_REQUESTS:-64}"
      - "--max-client-batch-size"
      - "${TEI_MAX_CLIENT_BATCH_SIZE:-1}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:80/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s

  tei-gpu1:
    image: ghcr.io/huggingface/text-embeddings-inference:1.9
    restart: unless-stopped
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
      AUTO_TRUNCATE: "false"
      TOKENIZATION_WORKERS: "${TEI_TOKENIZATION_WORKERS:-8}"
      # Required only if HF_MODEL_ID points to a private Hugging Face repo.
      HF_TOKEN: "${HF_TOKEN:-}"
    expose:
      - "80"
      - "9000"
    # For local debugging only, uncomment:
    # ports:
    #   - "127.0.0.1:8082:80"
    command:
      - "--model-id"
      - "${HF_MODEL_ID:-phambatien/bge-m3-vi-vists-best-eval}"
      - "--served-model-name"
      - "${MODEL_NAME:-bge-m3-vi-vists}"
      - "--dtype"
      - "float16"
      - "--pooling"
      - "cls"
      - "--max-concurrent-requests"
      - "${TEI_MAX_CONCURRENT_REQUESTS:-128}"
      - "--max-batch-tokens"
      - "${TEI_MAX_BATCH_TOKENS:-8192}"
      - "--max-batch-requests"
      - "${TEI_MAX_BATCH_REQUESTS:-64}"
      - "--max-client-batch-size"
      - "${TEI_MAX_CLIENT_BATCH_SIZE:-1}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:80/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    environment:
      MODEL_NAME: "${MODEL_NAME:-bge-m3-vi-vists}"
      EMBEDDING_API_KEYS: "${EMBEDDING_API_KEYS:?Set EMBEDDING_API_KEYS in .env}"
      TOKENIZER_PATH: "/app/model-tokenizer/tokenizer.json"
      MAX_INPUT_TOKENS: "${MAX_INPUT_TOKENS:-128}"
      MAX_BODY_BYTES: "${MAX_BODY_BYTES:-131072}"
      UPSTREAM_URLS: "http://tei-gpu0:80,http://tei-gpu1:80"
      UPSTREAM_TIMEOUT_MS: "${UPSTREAM_TIMEOUT_MS:-300}"
      RATE_LIMIT_RPM: "${RATE_LIMIT_RPM:-6000}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-200}"
      LOG_LEVEL: "INFO"
    volumes:
      # The gateway only needs tokenizer/config files for exact request validation.
      # Large model weights are ignored by .gitignore and served from Hugging Face by TEI.
      - "./bge-m3-vi-vists-best-eval:/app/model-tokenizer:ro"
    ports:
      - "8000:8000"
    depends_on:
      tei-gpu0:
        condition: service_started
      tei-gpu1:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway
      - tei-gpu0
      - tei-gpu1
